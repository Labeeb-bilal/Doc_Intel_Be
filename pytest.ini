[pytest]
asyncio_mode = auto
# The DB engine and Qdrant client are process-wide singletons (loaded once
# at startup in the real app); pytest-asyncio's default per-test event loop
# would rebind them across loops between tests and break asyncpg. Share one
# loop for the whole session instead.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
